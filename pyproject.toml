[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-thingie"
version = "0.4.0"
description = "Asset management - browse/download from civitai and manage loras/checkpoints"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.9.0,<4",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/pogo-pedagog/asset-thingie"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.comfy]
PublisherId = "pogo"
DisplayName = "AssetThingie"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "at-comfy/tests"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["UP042", "RUF001", "RUF003", "RUF006"]

[tool.coverage.run]
include = [
    "at_checkpoint_loader.py",
    "at_loraloader.py",
    "at-comfy/at_comfy/*",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
